# Assertion gates for lmloop. Commit = layer 1 (100%). Pull requests = layers
# 1–3, blocking when the pass rate drops by more than 2%. The nightly schedule
# runs layer 4 perturbations and fails the job as an alert; it does not gate merge.
name: lmloop eval gates

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install lmloop extras
        run: python -m pip install -r lmloop/requirements.txt
      - name: Unit tests
        working-directory: lmloop
        run: PYTHONPATH=. python -m unittest discover -s tests -q
      - name: Commit gate
        if: github.event_name == 'push'
        working-directory: lmloop
        run: PYTHONPATH=. python -m lmloop eval --gate commit --json
      - name: Pull request gate
        if: github.event_name == 'pull_request'
        working-directory: lmloop
        run: PYTHONPATH=. python -m lmloop eval --gate pr --json
      - name: Nightly gate
        if: github.event_name == 'schedule'
        working-directory: lmloop
        run: PYTHONPATH=. python -m lmloop eval --gate nightly --json
